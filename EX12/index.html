<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Fotos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Galeria de Fotos</h1>

    <div class="galeria">

        <!-- Miniatura 1 -->
        <figure>
            <a href="#foto1">
                <img src="foto1.jpg" alt="Paisagem natural">
            </a>
            <figcaption>Paisagem natural</figcaption>
        </figure>

        <!-- Miniatura 2 -->
        <figure>
            <a href="#foto2">
                <img src="foto2.jpg" alt="Cidade">
            </a>
            <figcaption>Vista da cidade</figcaption>
        </figure>

        <!-- Miniatura 3 -->
        <figure>
            <a href="#foto3">
                <img src="foto3.jpg" alt="Praia">
            </a>
            <figcaption>Paisagem da praia</figcaption>
        </figure>

        <!-- Miniatura 4 -->
        <figure>
            <a href="#foto4">
                <img src="foto4.jpg" alt="Montanhas">
            </a>
            <figcaption>Montanhas</figcaption>
        </figure>

    </div>


    <!-- Fotos ampliadas -->

    <div id="foto1" class="foto-ampliada">
        <a href="#">
            <img src="foto1.jpg" alt="Paisagem natural ampliada">
        </a>
        <p>Paisagem natural</p>
    </div>

    <div id="foto2" class="foto-ampliada">
        <a href="#">
            <img src="foto2.jpg" alt="Vista da cidade ampliada">
        </a>
        <p>Vista da cidade</p>
    </div>

    <div id="foto3" class="foto-ampliada">
        <a href="#">
            <img src="foto3.jpg" alt="Paisagem da praia ampliada">
        </a>
        <p>Paisagem da praia</p>
    </div>

    <div id="foto4" class="foto-ampliada">
        <a href="#">
            <img src="foto4.jpg" alt="Montanhas ampliadas">
        </a>
        <p>Montanhas</p>
    </div>

</body>
</html>
