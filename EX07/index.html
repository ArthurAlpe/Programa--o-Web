<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login">

        <h1>Login</h1>

        <form>

            <label for="usuario">Nome de usuário:</label>
            <input 
                type="text" 
                id="usuario" 
                name="usuario"
            >

            <label for="senha">Senha:</label>
            <input 
                type="password" 
                id="senha" 
                name="senha"
            >

            <button type="submit">Entrar</button>

        </form>

    </main>

</body>
</html>
